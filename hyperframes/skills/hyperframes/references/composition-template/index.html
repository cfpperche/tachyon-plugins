<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      GSAP via CDN. Determinism caveat: this is an external URL, so a render needs network and is not fully hermetic.
      Vendor GSAP locally if you require offline / byte-stable renders. The render fingerprint records the engine
      version but cannot pin a CDN response.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(120% 120% at 50% 0%, #14213d 0%, #000000 70%);
        /* "Roboto" is auto-resolved deterministically by the HyperFrames engine (fetched + injected as @font-face at
           render). Prefer an auto-resolved family over a system stack (which triggers a lint warning). */
        font-family: "Roboto", sans-serif;
        color: #fff;
      }
      #root { position: relative; width: 1920px; height: 1080px; }
      .clip { position: absolute; left: 0; right: 0; text-align: center; }
      #title    { top: 420px; font-size: 120px; font-weight: 800; letter-spacing: -2px; }
      #subtitle { top: 590px; font-size: 44px; font-weight: 400; color: #9bb4e3; }
      .accent { color: #4f7cff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="1">
        Your <span class="accent">title</span> here
      </div>
      <div id="subtitle" class="clip" data-start="0" data-duration="5" data-track-index="2">
        deterministic video, rendered from code
      </div>
    </div>
    <script>
      // A tiny GSAP entrance so the composition has motion. Edit freely; see the authoring reference + HyperFrames docs.
      gsap.from("#title", { duration: 1, y: 40, opacity: 0, ease: "power2.out" });
      gsap.from("#subtitle", { duration: 1, delay: 0.3, y: 24, opacity: 0, ease: "power2.out" });
    </script>
  </body>
</html>
